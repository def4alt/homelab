apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../immich
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: immich-server
      namespace: immich
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: immich-redis
      namespace: immich
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
