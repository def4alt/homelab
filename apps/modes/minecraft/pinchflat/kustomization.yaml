apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../pinchflat
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: pinchflat
      namespace: transmission
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
