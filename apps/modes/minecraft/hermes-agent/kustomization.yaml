apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../hermes-agent
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: hermes-agent
      namespace: ai
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
