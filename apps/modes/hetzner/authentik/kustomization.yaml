apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../authentik
patches:
  - target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: authentik-tls
      namespace: authentik
    patch: |-
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: authentik-tls
        namespace: authentik
