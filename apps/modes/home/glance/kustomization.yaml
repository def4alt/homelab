apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../glance
patches:
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: glance-data
      namespace: glance
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: manual-local
      - op: add
        path: /spec/volumeName
        value: perun-glance-data-local
      - op: remove
        path: /metadata/labels/recurring-job.longhorn.io~1source
      - op: remove
        path: /metadata/labels/recurring-job-group.longhorn.io~1glance
