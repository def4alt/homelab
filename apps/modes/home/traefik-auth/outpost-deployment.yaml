apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik-home-forward-auth-outpost
  namespace: authentik
  labels:
    app.kubernetes.io/instance: traefik-home-forward-auth-outpost
    app.kubernetes.io/name: authentik-outpost
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: traefik-home-forward-auth-outpost
      app.kubernetes.io/name: authentik-outpost
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: traefik-home-forward-auth-outpost
        app.kubernetes.io/name: authentik-outpost
    spec:
      containers:
        - name: proxy
          image: ghcr.io/goauthentik/proxy:2026.5.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
            - name: https
              containerPort: 9443
              protocol: TCP
          env:
            - name: AUTHENTIK_HOST
              valueFrom:
                secretKeyRef:
                  name: traefik-home-forward-auth-outpost-api
                  key: authentik_host
            - name: AUTHENTIK_HOST_BROWSER
              valueFrom:
                secretKeyRef:
                  name: traefik-home-forward-auth-outpost-api
                  key: authentik_host_browser
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: traefik-home-forward-auth-outpost-api
                  key: token
            - name: AUTHENTIK_INSECURE
              valueFrom:
                secretKeyRef:
                  name: traefik-home-forward-auth-outpost-api
                  key: authentik_host_insecure
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
