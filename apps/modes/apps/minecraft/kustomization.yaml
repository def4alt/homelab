apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../minecraft
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: minecraft
      namespace: minecraft
    patch: |-
      - op: replace
        path: /spec/values/replicaCount
        value: 0
