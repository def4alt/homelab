apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance
  namespace: glance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glance
  template:
    metadata:
      labels:
        app: glance
    spec:
      containers:
        - name: glance
          image: glanceapp/glance:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: GLANCE_CONFIG_FILE
              value: /app/config/glance.yml
            - name: GLANCE_DATA_DIR
              value: /app/assets
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: data
              mountPath: /app/assets
          readinessProbe:
            httpGet:
              path: /healthchecks
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthchecks
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: glance-config
        - name: data
          persistentVolumeClaim:
            claimName: glance-data
