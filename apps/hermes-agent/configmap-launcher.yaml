apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-launcher
  namespace: ai
data:
  start-hermes.sh: |
    #!/bin/sh
    set -eu

    vault_env=/vault/secrets/hermes.env
    hermes_env=/opt/data/.env
    hermes_config=/opt/data/config.yaml

    i=0
    while [ ! -s "$vault_env" ]; do
      i=$((i + 1))
      if [ "$i" -ge 120 ]; then
        echo "vault-injected env file not ready: $vault_env" >&2
        exit 1
      fi
      sleep 1
    done

    ln -sf "$vault_env" "$hermes_env"

    python3 - "$hermes_config" <<'PY'
    from pathlib import Path
    import sys

    path = Path(sys.argv[1])
    if not path.exists():
        raise SystemExit(0)

    lines = path.read_text().splitlines()

    terminal_index = next((i for i, line in enumerate(lines) if line.startswith("terminal:")), None)
    if terminal_index is None:
        if lines and lines[-1] != "":
            lines.append("")
        lines.extend([
            "terminal:",
            "  env_passthrough:",
            "    - GITHUB_TOKEN",
        ])
        path.write_text("\n".join(lines) + "\n")
        raise SystemExit(0)

    terminal_end = len(lines)
    for i in range(terminal_index + 1, len(lines)):
        line = lines[i]
        if line and not line.startswith(" "):
            terminal_end = i
            break

    for i in range(terminal_index + 1, terminal_end):
        if not lines[i].startswith("  env_passthrough:"):
            continue

        passthrough_end = i + 1
        has_github_token = False
        for j in range(i + 1, terminal_end):
            line = lines[j]
            if line and not line.startswith("    "):
                break
            passthrough_end = j + 1
            if line.strip() == "- GITHUB_TOKEN":
                has_github_token = True

        if not has_github_token:
            lines.insert(passthrough_end, "    - GITHUB_TOKEN")
            path.write_text("\n".join(lines) + "\n")
        raise SystemExit(0)

    insert_at = terminal_end
    for i in range(terminal_index + 1, terminal_end):
        if lines[i].startswith("  timeout:"):
            insert_at = i + 1
            break

    lines[insert_at:insert_at] = [
        "  env_passthrough:",
        "    - GITHUB_TOKEN",
    ]
    path.write_text("\n".join(lines) + "\n")
    PY

    exec /opt/hermes/.venv/bin/python3 /opt/hermes/.venv/bin/hermes gateway
