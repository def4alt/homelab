apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: ai
  labels:
    app: hermes-agent
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: hermes-agent
        vault.hashicorp.com/agent-inject-secret-hermes-env: kv/data/hermes-agent
        vault.hashicorp.com/agent-inject-file-hermes-env: hermes.env
        vault.hashicorp.com/agent-inject-template-hermes-env: |
          {{- with secret "kv/data/hermes-agent" -}}
          OPENROUTER_API_KEY={{ .Data.data.openrouter_api_key }}
          TELEGRAM_BOT_TOKEN={{ .Data.data.telegram_bot_token }}
          TELEGRAM_ALLOWED_USERS={{ .Data.data.telegram_allowed_users }}
          GITHUB_TOKEN={{ .Data.data.github_token }}
          {{- end }}
    spec:
      serviceAccountName: hermes-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hermes
          image: ghcr.io/def4alt/hermes-agent-homelab:main
          imagePullPolicy: Always
          command:
            - /bin/sh
            - /opt/bin/start-hermes.sh
          env:
            - name: HOME
              value: /opt/data
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_INFERENCE_PROVIDER
              value: openrouter
            - name: API_SERVER_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8642
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  python3 - <<'PY'
                  import urllib.request
                  import sys

                  try:
                      with urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3) as response:
                          sys.exit(0 if response.status == 200 else 1)
                  except Exception:
                      sys.exit(1)
                  PY
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  python3 - <<'PY'
                  import urllib.request
                  import sys

                  try:
                      with urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3) as response:
                          sys.exit(0 if response.status == 200 else 1)
                  except Exception:
                      sys.exit(1)
                  PY
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  python3 - <<'PY'
                  import urllib.request
                  import sys

                  try:
                      with urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3) as response:
                          sys.exit(0 if response.status == 200 else 1)
                  except Exception:
                      sys.exit(1)
                  PY
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: launcher
              mountPath: /opt/bin
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent-data
        - name: launcher
          configMap:
            name: hermes-agent-launcher
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
