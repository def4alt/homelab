apiVersion: apps/v1
kind: Deployment
metadata:
  name: couchdb
  namespace: livesync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: couchdb
  template:
    metadata:
      labels:
        app: couchdb
    spec:
      initContainers:
        - name: seed-config
          image: busybox
          command:
            - sh
            - -c
            - |
              cp /config/local.ini /opt/couchdb/etc/local.d/cors.ini
              echo "Seeded local.d/cors.ini"
              ls -la /opt/couchdb/etc/local.d/
          volumeMounts:
            - name: config-src
              mountPath: /config
            - name: config-dir
              mountPath: /opt/couchdb/etc/local.d
      containers:
        - name: couchdb
          image: couchdb:3.4
          ports:
            - name: http
              containerPort: 5984
          env:
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: couchdb-admin
                  key: username
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb-admin
                  key: password
            - name: ERL_FLAGS
              value: "-setcookie couchdb"
          readinessProbe:
            tcpSocket:
              port: 5984
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5984
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
            - name: config-dir
              mountPath: /opt/couchdb/etc/local.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: couchdb-data
        - name: config-src
          configMap:
            name: couchdb-config
        - name: config-dir
          emptyDir: {}
