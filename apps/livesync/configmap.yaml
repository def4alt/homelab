apiVersion: v1
kind: ConfigMap
metadata:
  name: couchdb-config
  namespace: livesync
data:
  cors.ini: |
    [chttpd]
    enable_cors = true
    require_valid_user = true

    [httpd]
    enable_cors = true
    WWW-Authenticate = Basic realm="couchdb"

    [cors]
    origins = app://obsidian.md,capacitor://localhost,http://localhost,https://localhost
    credentials = true

    [couchdb]
    single_node = true
