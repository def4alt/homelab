apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: infra
spec:
  interval: 10m
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: infra
  values:
    deployment:
      replicas: 2
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
            topologyKey: kubernetes.io/hostname
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    service:
      type: ClusterIP
    ports:
      web:
        port: 80
        hostPort: 80
      websecure:
        port: 443
        hostPort: 443
    additionalArguments:
      - "--providers.kubernetescrd"
      - "--providers.kubernetesingress"
      - "--entrypoints.websecure.transport.respondingtimeouts.readtimeout=600s"
      - "--entrypoints.websecure.transport.respondingtimeouts.writetimeout=600s"
      - "--entrypoints.websecure.transport.respondingtimeouts.idletimeout=600s"
    persistence:
      enabled: false
    ingressRoute:
      dashboard:
        enabled: true
