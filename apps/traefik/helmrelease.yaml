apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: infra
spec:
  interval: 10m
  chart:
    spec:
      chart: traefik
      version: 41.2.0
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: infra
  values:
    deployment:
      replicas: 1
    updateStrategy:
      type: Recreate
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    ports:
      web:
        port: 80
      websecure:
        port: 443
    additionalArguments:
      - "--entrypoints.websecure.transport.respondingtimeouts.readtimeout=600s"
      - "--entrypoints.websecure.transport.respondingtimeouts.writetimeout=600s"
      - "--entrypoints.websecure.transport.respondingtimeouts.idletimeout=600s"
    ingressRoute:
      dashboard:
        enabled: true
