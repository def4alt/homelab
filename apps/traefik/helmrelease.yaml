apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: infra
spec:
  interval: 10m
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: infra
  values:
    deployment:
      replicas: 1
    service:
      type: ClusterIP
    additionalArguments:
      - "--providers.kubernetescrd"
      - "--providers.kubernetesingress"
    persistence:
      enabled: false
    ingressRoute:
      dashboard:
        enabled: true
