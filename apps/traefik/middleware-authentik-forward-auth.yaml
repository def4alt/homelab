apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forward-auth
  namespace: infra
spec:
  forwardAuth:
    address: http://ak-outpost-traefik-forward-auth-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    addAuthCookiesToResponse:
      - authentik_proxy_7688b6ef
      - authentik_proxy_c837649c
      - authentik_proxy_6208ef0f
      - authentik_proxy_3e1e967e
      - authentik_proxy_39fa9ec1
      - authentik_proxy_d029fa3a
      - authentik_proxy_81b8a03f
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
