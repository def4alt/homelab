apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: home-assistant-db-weekly
  namespace: home-assistant
spec:
  schedule: "0 15 21 * * 4"
  backupOwnerReference: self
  cluster:
    name: home-assistant-db-local
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
