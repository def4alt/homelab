apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: home-assistant-db-daily
  namespace: home-assistant
spec:
  schedule: "0 15 3 * * *"
  backupOwnerReference: self
  cluster:
    name: home-assistant-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
