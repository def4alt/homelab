apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: home-assistant
      version: 0.3.74
      sourceRef:
        kind: HelmRepository
        name: home-assistant
        namespace: home-assistant
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      type: Deployment
    deploymentStrategy: Recreate
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet
    nodeSelector:
      kubernetes.io/hostname: perun
    securityContext:
      privileged: true
    additionalVolumes:
      - name: zigbee-stick
        hostPath:
          path: /dev/ttyUSB0
          type: CharDevice
    additionalMounts:
      - name: zigbee-stick
        mountPath: /dev/ttyUSB0
    initContainers:
      - name: reconcile-nikitos-account
        image: ghcr.io/home-assistant/home-assistant:2026.8.1
        command: ["/bin/sh", "-ec"]
        args:
          - |
            if python -m homeassistant --script auth -c /config list | grep -Fxq "$NIKITOS_USERNAME"; then
              python -m homeassistant --script auth -c /config change_password "$NIKITOS_USERNAME" "$NIKITOS_PASSWORD"
              exit 0
            fi
            python -m homeassistant --script auth -c /config add "$NIKITOS_USERNAME" "$NIKITOS_PASSWORD"
        envFrom:
          - secretRef:
              name: home-assistant-nikitos-account
        volumeMounts:
          - name: home-assistant-pvc
            mountPath: /config
    persistence:
      enabled: true
      accessMode: ReadWriteOnce
      size: 10Gi
      existingClaim: home-assistant-config
    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: home.def4alt.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: home-assistant-tls
          hosts:
            - home.def4alt.com
    configuration:
      enabled: true
      forceInit: true
      trusted_proxies:
        - 10.42.0.0/16
      templateConfig: |-
        default_config:

        http:
          use_x_forwarded_for: true
          trusted_proxies:
            - 10.42.0.0/16

        recorder:
          db_url: !env_var postgres_url
          purge_keep_days: 30

        frontend:
          themes: !include_dir_merge_named themes

        automation: !include automations.yaml
        script: !include scripts.yaml
        scene: !include scenes.yaml
    env:
      - name: TZ
        value: "Europe/Berlin"
    envFrom:
      - secretRef:
          name: home-assistant-secrets
