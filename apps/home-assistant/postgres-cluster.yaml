apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: home-assistant-db
  namespace: home-assistant
spec:
  instances: 1
  bootstrap:
    recovery:
      source: pre-rename
  storage:
    size: 25Gi
    storageClass: manual-local
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-barman-s3
        serverName: home-assistant-db-20260718
  externalClusters:
    - name: pre-rename
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: cnpg-barman-s3
          serverName: home-assistant-db-local
