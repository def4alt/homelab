apiVersion: v1
kind: ServiceAccount
metadata:
  name: executor
  namespace: executor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: executor
  namespace: executor
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status", "pods/log"]
    verbs: ["create", "delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: executor
  namespace: executor
subjects:
  - kind: ServiceAccount
    name: executor
    namespace: executor
roleRef:
  kind: Role
  name: executor
  apiGroup: rbac.authorization.k8s.io
