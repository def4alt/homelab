apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: executor-db
  namespace: executor
spec:
  instances: 1
  bootstrap:
    initdb:
      database: executor
      owner: executor
      secret:
        name: executor-db-auth
  storage:
    size: 5Gi
  monitoring:
    enablePodMonitor: true
