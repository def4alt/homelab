apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-flows
  namespace: authentik
data:
  authentication-flows.yaml: |
    version: 1
    metadata:
      name: Authentication flows
      labels:
        managed-by: gitops
    entries:
      # ── Policies ──
      - model: authentik_policies_expression.expressionpolicy
        id: policy-only-me
        identifiers:
          name: Restrict to akadmin
        attrs:
          name: Restrict to akadmin
          execution_logging: true
          expression: |
            allowed_usernames = ["akadmin"]
            return (
              request.user is not None
              and request.user.is_authenticated
              and request.user.username in allowed_usernames
            )

      - model: authentik_policies_expression.expressionpolicy
        id: policy-any-authenticated
        identifiers:
          name: Any authenticated user
        attrs:
          name: Any authenticated user
          execution_logging: false
          expression: |
            return request.user is not None and request.user.is_authenticated

      - model: authentik_policies_expression.expressionpolicy
        id: policy-skip-mfa-after-passkey
        identifiers:
          name: Skip MFA after passkey login
        attrs:
          name: Skip MFA after passkey login
          execution_logging: true
          expression: |
            return request.context.get("auth_method") != "auth_webauthn_pwl"

      # ── Authentication flow ──
      - model: authentik_flows.flow
        id: flow-default-authentication
        identifiers:
          slug: default-authentication-flow
        attrs:
          designation: authentication
          name: Welcome to authentik!
          title: Welcome to authentik!

      # ── Stages ──
      - model: authentik_stages_identification.identificationstage
        id: stage-identification
        identifiers:
          name: default-authentication-identification
        attrs:
          name: default-authentication-identification

      - model: authentik_stages_password.passwordstage
        id: stage-password
        identifiers:
          name: default-authentication-password
        attrs:
          name: default-authentication-password
          configure_flow: !Find [authentik_flows.flow, [slug, default-password-change]]

      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        id: stage-mfa-validation
        identifiers:
          name: default-authentication-mfa-validation
        attrs:
          name: default-authentication-mfa-validation

      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        id: stage-passkey-validation
        identifiers:
          name: default-authentication-passkey-validation
        attrs:
          name: default-authentication-passkey-validation
          not_configured_action: skip
          device_classes:
            - webauthn
          webauthn_user_verification: preferred

      - model: authentik_stages_user_login.userloginstage
        id: stage-login
        identifiers:
          name: default-authentication-login
        attrs:
          name: default-authentication-login
          session_duration: seconds=0

      # ── Flow stage bindings ──
      - model: authentik_flows.flowstagebinding
        id: binding-identification
        identifiers:
          target: !KeyOf flow-default-authentication
          order: 10
        attrs:
          target: !KeyOf flow-default-authentication
          stage: !KeyOf stage-identification
          order: 10

      - model: authentik_flows.flowstagebinding
        id: binding-password
        identifiers:
          target: !KeyOf flow-default-authentication
          order: 20
        attrs:
          target: !KeyOf flow-default-authentication
          stage: !KeyOf stage-password
          order: 20

      - model: authentik_flows.flowstagebinding
        id: binding-mfa
        identifiers:
          target: !KeyOf flow-default-authentication
          order: 30
        attrs:
          target: !KeyOf flow-default-authentication
          stage: !KeyOf stage-mfa-validation
          order: 30
          evaluate_on_plan: false
          re_evaluate_policies: true

      - model: authentik_flows.flowstagebinding
        id: binding-login
        identifiers:
          target: !KeyOf flow-default-authentication
          order: 100
        attrs:
          target: !KeyOf flow-default-authentication
          stage: !KeyOf stage-login
          order: 100

      # ── Passkey integration into identification stage ──
      - model: authentik_stages_identification.identificationstage
        id: stage-identification
        identifiers:
          name: default-authentication-identification
        attrs:
          webauthn_stage: !KeyOf stage-passkey-validation

      # ── Policy binding: skip MFA after passkey ──
      - model: authentik_policies.policybinding
        id: binding-skip-mfa-after-passkey
        identifiers:
          target: !KeyOf binding-mfa
          order: 0
        attrs:
          target: !KeyOf binding-mfa
          policy: !KeyOf policy-skip-mfa-after-passkey
          order: 0
          negate: false
          enabled: true
          failure_result: false
