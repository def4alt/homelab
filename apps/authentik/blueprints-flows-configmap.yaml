apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-flows
  namespace: authentik
data:
  policies.yaml: |
    version: 1
    metadata:
      name: Custom access policies
      labels:
        managed-by: gitops
    entries:
      - model: authentik_policies_expression.expressionpolicy
        id: policy-restrict-akadmin
        identifiers:
          name: Restrict to akadmin
        attrs:
          name: Restrict to akadmin
          execution_logging: true
          expression: |
            allowed_usernames = ["akadmin"]
            return (
              request.user is not None
              and request.user.is_authenticated
              and request.user.username in allowed_usernames
            )

      - model: authentik_policies_expression.expressionpolicy
        id: policy-any-authenticated
        identifiers:
          name: Any authenticated user
        attrs:
          name: Any authenticated user
          execution_logging: false
          expression: |
            return request.user is not None and request.user.is_authenticated

      - model: authentik_policies_expression.expressionpolicy
        id: policy-skip-mfa-after-passkey
        identifiers:
          name: Skip MFA after passkey login
        attrs:
          name: Skip MFA after passkey login
          execution_logging: true
          expression: |
            return request.context.get("auth_method") != "auth_webauthn_pwl"

      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        id: stage-passkey-validation
        identifiers:
          name: default-authentication-passkey-validation
        attrs:
          name: default-authentication-passkey-validation
          not_configured_action: skip
          device_classes:
            - webauthn
          webauthn_user_verification: preferred

      - model: authentik_stages_identification.identificationstage
        id: stage-identification-passkey
        identifiers:
          name: default-authentication-identification
        attrs:
          name: default-authentication-identification
          webauthn_stage: !KeyOf stage-passkey-validation

      - model: authentik_outposts.kubernetesserviceconnection
        id: service-connection-local
        identifiers:
          name: Local Kubernetes Cluster
        attrs:
          name: Local Kubernetes Cluster
          local: true
          verify_ssl: true
          kubeconfig: {}

      - model: authentik_providers_proxy.proxyprovider
        id: provider-pihole
        identifiers:
          name: Pi-hole Forward Auth
        attrs:
          name: Pi-hole Forward Auth
          mode: forward_domain
          external_host: https://auth.def4alt.com
          cookie_domain: ".def4alt.com"
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_providers_proxy.proxyprovider
        id: provider-immich
        identifiers:
          name: Immich Forward Auth
        attrs:
          name: Immich Forward Auth
          mode: forward_domain
          external_host: https://auth.def4alt.com
          cookie_domain: ".def4alt.com"
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_providers_proxy.proxyprovider
        id: provider-paperless
        identifiers:
          name: Paperless Forward Auth
        attrs:
          name: Paperless Forward Auth
          mode: forward_domain
          external_host: https://auth.def4alt.com
          cookie_domain: ".def4alt.com"
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_providers_proxy.proxyprovider
        id: provider-glance
        identifiers:
          name: Glance Forward Auth
        attrs:
          name: Glance Forward Auth
          mode: forward_domain
          external_host: https://auth.def4alt.com
          cookie_domain: ".def4alt.com"
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_providers_proxy.proxyprovider
        id: provider-linkding
        identifiers:
          name: Linkding Forward Auth
        attrs:
          name: Linkding Forward Auth
          mode: forward_domain
          external_host: https://auth.def4alt.com
          cookie_domain: ".def4alt.com"
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_providers_proxy.proxyprovider
        id: provider-metube
        identifiers:
          name: MeTube Forward Auth
        attrs:
          name: MeTube Forward Auth
          mode: forward_domain
          external_host: https://auth.def4alt.com
          cookie_domain: ".def4alt.com"
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_providers_proxy.proxyprovider
        id: provider-transmission
        identifiers:
          name: Transmission Forward Auth
        attrs:
          name: Transmission Forward Auth
          mode: forward_domain
          external_host: https://auth.def4alt.com
          cookie_domain: ".def4alt.com"
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        id: app-pihole
        identifiers:
          slug: pihole
        attrs:
          name: Pi-hole
          slug: pihole
          provider: !KeyOf provider-pihole

      - model: authentik_core.application
        id: app-immich
        identifiers:
          slug: immich
        attrs:
          name: Immich
          slug: immich
          provider: !KeyOf provider-immich

      - model: authentik_core.application
        id: app-paperless
        identifiers:
          slug: paperless
        attrs:
          name: Paperless
          slug: paperless
          provider: !KeyOf provider-paperless

      - model: authentik_core.application
        id: app-glance
        identifiers:
          slug: glance
        attrs:
          name: Glance
          slug: glance
          provider: !KeyOf provider-glance

      - model: authentik_core.application
        id: app-linkding
        identifiers:
          slug: linkding
        attrs:
          name: Linkding
          slug: linkding
          provider: !KeyOf provider-linkding

      - model: authentik_core.application
        id: app-metube
        identifiers:
          slug: metube
        attrs:
          name: MeTube
          slug: metube
          provider: !KeyOf provider-metube

      - model: authentik_core.application
        id: app-transmission
        identifiers:
          slug: transmission
        attrs:
          name: Transmission
          slug: transmission
          provider: !KeyOf provider-transmission

      - model: authentik_policies.policybinding
        id: binding-pihole
        identifiers:
          target: !KeyOf app-pihole
          policy: !KeyOf policy-restrict-akadmin
          order: 0
        attrs:
          target: !KeyOf app-pihole
          policy: !KeyOf policy-restrict-akadmin
          order: 0

      - model: authentik_policies.policybinding
        id: binding-immich
        identifiers:
          target: !KeyOf app-immich
          policy: !KeyOf policy-any-authenticated
          order: 0
        attrs:
          target: !KeyOf app-immich
          policy: !KeyOf policy-any-authenticated
          order: 0

      - model: authentik_policies.policybinding
        id: binding-paperless
        identifiers:
          target: !KeyOf app-paperless
          policy: !KeyOf policy-any-authenticated
          order: 0
        attrs:
          target: !KeyOf app-paperless
          policy: !KeyOf policy-any-authenticated
          order: 0

      - model: authentik_policies.policybinding
        id: binding-glance
        identifiers:
          target: !KeyOf app-glance
          policy: !KeyOf policy-any-authenticated
          order: 0
        attrs:
          target: !KeyOf app-glance
          policy: !KeyOf policy-any-authenticated
          order: 0

      - model: authentik_policies.policybinding
        id: binding-linkding
        identifiers:
          target: !KeyOf app-linkding
          policy: !KeyOf policy-any-authenticated
          order: 0
        attrs:
          target: !KeyOf app-linkding
          policy: !KeyOf policy-any-authenticated
          order: 0

      - model: authentik_policies.policybinding
        id: binding-metube
        identifiers:
          target: !KeyOf app-metube
          policy: !KeyOf policy-any-authenticated
          order: 0
        attrs:
          target: !KeyOf app-metube
          policy: !KeyOf policy-any-authenticated
          order: 0

      - model: authentik_policies.policybinding
        id: binding-transmission
        identifiers:
          target: !KeyOf app-transmission
          policy: !KeyOf policy-any-authenticated
          order: 0
        attrs:
          target: !KeyOf app-transmission
          policy: !KeyOf policy-any-authenticated
          order: 0

      - model: authentik_outposts.outpost
        id: outpost-traefik-forward-auth
        identifiers:
          name: Traefik Forward Auth Outpost
        attrs:
          name: Traefik Forward Auth Outpost
          type: proxy
          service_connection: !KeyOf service-connection-local
          providers:
            - !KeyOf provider-pihole
            - !KeyOf provider-immich
            - !KeyOf provider-paperless
            - !KeyOf provider-glance
            - !KeyOf provider-linkding
            - !KeyOf provider-metube
            - !KeyOf provider-transmission
          config:
            authentik_host: https://auth.def4alt.com
            authentik_host_insecure: false
            authentik_host_browser: https://auth.def4alt.com
            kubernetes_replicas: 1
            kubernetes_namespace: authentik
            kubernetes_service_type: ClusterIP
