apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-core
  namespace: authentik
data:
  authentication-core.yaml: |
    version: 1
    metadata:
      name: Default - Authentication flow
    entries:
      - model: authentik_policies_expression.expressionpolicy
        id: policy-only-me
        identifiers:
          name: Traefik only-me
        attrs:
          name: Traefik only-me
          execution_logging: true
          expression: |
            allowed_usernames = ["akadmin"]
            return (
              request.user is not None
              and request.user.is_authenticated
              and request.user.username in allowed_usernames
            )

      - model: authentik_policies_expression.expressionpolicy
        id: policy-skip-mfa-after-passkey
        identifiers:
          name: Skip MFA after passkey login
        attrs:
          name: Skip MFA after passkey login
          execution_logging: true
          expression: |
            return request.context.get("auth_method") != "auth_webauthn_pwl"

      - attrs:
          designation: authentication
          name: Welcome to authentik!
          title: Welcome to authentik!
        identifiers:
          slug: default-authentication-flow
        model: authentik_flows.flow
        id: flow

      - attrs:
          configure_flow:
            !Find [authentik_flows.flow, [slug, default-password-change]]
        identifiers:
          name: default-authentication-password
        id: default-authentication-password
        model: authentik_stages_password.passwordstage

      - identifiers:
          name: default-authentication-mfa-validation
        id: default-authentication-mfa-validation
        model: authentik_stages_authenticator_validate.authenticatorvalidatestage

      - identifiers:
          name: default-authentication-identification
        id: default-authentication-identification
        model: authentik_stages_identification.identificationstage

      - attrs:
          session_duration: seconds=0
        identifiers:
          name: default-authentication-login
        id: default-authentication-login
        model: authentik_stages_user_login.userloginstage

      - identifiers:
          order: 10
          stage: !KeyOf default-authentication-identification
          target: !KeyOf flow
        model: authentik_flows.flowstagebinding
        id: default-authentication-identification-binding

      - identifiers:
          order: 20
          stage: !KeyOf default-authentication-password
          target: !KeyOf flow
        model: authentik_flows.flowstagebinding
        id: default-authentication-password-binding

      - identifiers:
          order: 30
          stage: !KeyOf default-authentication-mfa-validation
          target: !KeyOf flow
        model: authentik_flows.flowstagebinding
        id: default-authentication-mfa-validation-binding
        attrs:
          evaluate_on_plan: false
          re_evaluate_policies: true

      - model: authentik_policies.policybinding
        id: bind-skip-mfa-after-passkey
        identifiers:
          target: !KeyOf default-authentication-mfa-validation-binding
          order: 0
        attrs:
          target: !KeyOf default-authentication-mfa-validation-binding
          policy: !KeyOf policy-skip-mfa-after-passkey
          order: 0
          negate: false
          enabled: true
          failure_result: false

      - identifiers:
          order: 100
          stage: !KeyOf default-authentication-login
          target: !KeyOf flow
        model: authentik_flows.flowstagebinding
        id: default-authentication-login-binding
