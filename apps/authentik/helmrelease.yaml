apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 10m
  chart:
    spec:
      chart: authentik
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
  values:
    blueprints:
      configMaps:
        - authentik-blueprints
    authentik:
      enabled: false
    postgresql:
      enabled: false
    server:
      replicas: 2
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: authentik
                  app.kubernetes.io/component: server
              topologyKey: kubernetes.io/hostname
      persistence:
        size: 20Gi
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 2Gi
      ingress:
        enabled: true
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - auth.def4alt.com
        tls:
          - secretName: authentik-tls
            hosts:
              - auth.def4alt.com
    worker:
      replicas: 2
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: authentik
                  app.kubernetes.io/component: worker
              topologyKey: kubernetes.io/hostname
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
