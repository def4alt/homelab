apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ollama-toggle
  namespace: ai
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: infra-authentik-forward-auth@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: ollama-toggle.def4alt.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ollama-toggle
                port:
                  number: 80
  tls:
    - secretName: ollama-toggle-tls
      hosts:
        - ollama-toggle.def4alt.com
