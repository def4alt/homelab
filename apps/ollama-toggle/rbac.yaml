apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ollama-toggle
  namespace: ai
rules:
  - apiGroups:
      - apps
    resources:
      - deployments/scale
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ollama-toggle
  namespace: ai
subjects:
  - kind: ServiceAccount
    name: ollama-toggle
    namespace: ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ollama-toggle
