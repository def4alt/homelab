apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-toggle
  namespace: ai
data:
  server.py: |
    import json
    import os
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from urllib import request, error
    import ssl

    NAMESPACE = os.environ.get("TARGET_NAMESPACE", "ai")
    DEPLOYMENT = os.environ.get("TARGET_DEPLOYMENT", "ollama")
    HOST = os.environ.get("LISTEN_HOST", "0.0.0.0")
    PORT = int(os.environ.get("LISTEN_PORT", "8080"))

    TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    API_SERVER = "https://kubernetes.default.svc"

    def load_token() -> str:
      with open(TOKEN_PATH, "r", encoding="utf-8") as handle:
        return handle.read().strip()

    def api_request(method: str, path: str, payload: dict | None = None) -> dict:
      token = load_token()
      url = f"{API_SERVER}{path}"
      headers = {
        "Authorization": f"Bearer {token}",
        "Accept": "application/json",
      }
      data = None
      if payload is not None:
        data = json.dumps(payload).encode("utf-8")
        headers["Content-Type"] = "application/merge-patch+json"
      context = ssl.create_default_context(cafile=CA_PATH)
      req = request.Request(url, data=data, headers=headers, method=method)
      with request.urlopen(req, context=context, timeout=10) as resp:
        return json.loads(resp.read().decode("utf-8"))

    def get_replicas() -> int:
      scale = api_request(
        "GET",
        f"/apis/apps/v1/namespaces/{NAMESPACE}/deployments/{DEPLOYMENT}/scale",
      )
      return int(scale.get("spec", {}).get("replicas", 0))

    def set_replicas(replicas: int) -> int:
      api_request(
        "PATCH",
        f"/apis/apps/v1/namespaces/{NAMESPACE}/deployments/{DEPLOYMENT}/scale",
        {"spec": {"replicas": replicas}},
      )
      return replicas

    class Handler(BaseHTTPRequestHandler):
      def do_GET(self) -> None:
        if self.path == "/healthz":
          self.respond(200, {"status": "ok"})
          return

        if self.path.startswith("/toggle"):
          try:
            current = get_replicas()
            desired = 0 if current > 0 else 1
            set_replicas(desired)
            self.respond(200, {"replicas": desired})
          except (error.URLError, ValueError) as exc:
            self.respond(500, {"error": str(exc)})
          return

        self.respond(404, {"error": "not found"})

      def log_message(self, fmt: str, *args: object) -> None:
        return

      def respond(self, code: int, payload: dict) -> None:
        body = json.dumps(payload).encode("utf-8")
        self.send_response(code)
        self.send_header("Content-Type", "application/json")
        self.send_header("Content-Length", str(len(body)))
        self.end_headers()
        self.wfile.write(body)

    if __name__ == "__main__":
      server = HTTPServer((HOST, PORT), Handler)
      server.serve_forever()
