apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-rag-script
  namespace: ai
data:
  sync_paperless.py: |
    import json
    import os
    import re
    import sys
    from pathlib import Path

    import requests

    PAPERLESS_URL = os.environ.get("PAPERLESS_URL", "").rstrip("/")
    PAPERLESS_TOKEN = os.environ.get("PAPERLESS_TOKEN", "")
    PAPERLESS_USERNAME = os.environ.get("PAPERLESS_USERNAME", "")
    PAPERLESS_PASSWORD = os.environ.get("PAPERLESS_PASSWORD", "")
    OUTPUT_DIR = Path(os.environ.get("OUTPUT_DIR", "/data/paperless"))
    STATE_FILE = Path(os.environ.get("STATE_FILE", "/data/state.json"))
    OPEN_WEBUI_BASE_URL = os.environ.get("OPEN_WEBUI_BASE_URL", "").rstrip("/")
    OPEN_WEBUI_API_KEY = os.environ.get("OPEN_WEBUI_API_KEY", "")

    def die(message: str) -> None:
      print(message, file=sys.stderr)
      sys.exit(1)

    if not PAPERLESS_URL:
      die("PAPERLESS_URL is required")

    if not PAPERLESS_TOKEN and (not PAPERLESS_USERNAME or not PAPERLESS_PASSWORD):
      die("PAPERLESS_TOKEN or PAPERLESS_USERNAME/PAPERLESS_PASSWORD are required")

    OUTPUT_DIR.mkdir(parents=True, exist_ok=True)

    def load_state() -> dict:
      if not STATE_FILE.exists():
        return {}
      try:
        return json.loads(STATE_FILE.read_text())
      except json.JSONDecodeError:
        return {}

    def save_state(state: dict) -> None:
      STATE_FILE.write_text(json.dumps(state, indent=2, sort_keys=True))

    def sanitize(name: str) -> str:
      name = re.sub(r"[^A-Za-z0-9._-]+", "-", name).strip("-")
      return name or "document"

    def get_token() -> str:
      if PAPERLESS_TOKEN:
        return PAPERLESS_TOKEN
      response = requests.post(
        f"{PAPERLESS_URL}/api/token/",
        json={"username": PAPERLESS_USERNAME, "password": PAPERLESS_PASSWORD},
        timeout=15,
      )
      response.raise_for_status()
      data = response.json()
      token = data.get("token")
      if not token:
        die("Paperless token response missing 'token'")
      return token

    def build_headers(token: str) -> dict:
      return {"Authorization": f"Token {token}"}

    def fetch_page(token: str, page: int) -> dict:
      response = requests.get(
        f"{PAPERLESS_URL}/api/documents/?page={page}",
        headers=build_headers(token),
        timeout=30,
      )
      response.raise_for_status()
      return response.json()

    def fetch_document(token: str, doc_id: int) -> dict:
      response = requests.get(
        f"{PAPERLESS_URL}/api/documents/{doc_id}/",
        headers=build_headers(token),
        timeout=30,
      )
      response.raise_for_status()
      return response.json()

    def fetch_text_fallback(token: str, doc_id: int) -> str | None:
      response = requests.get(
        f"{PAPERLESS_URL}/api/documents/{doc_id}/download/?format=txt",
        headers=build_headers(token),
        timeout=60,
      )
      if response.status_code != 200:
        return None
      return response.text

    def push_to_open_webui(title: str, content: str) -> None:
      if not OPEN_WEBUI_BASE_URL or not OPEN_WEBUI_API_KEY:
        return
      response = requests.post(
        f"{OPEN_WEBUI_BASE_URL}/api/v1/documents",
        headers={"Authorization": f"Bearer {OPEN_WEBUI_API_KEY}"},
        json={"title": title, "content": content},
        timeout=30,
      )
      response.raise_for_status()

    state = load_state()
    token = get_token()
    page = 1
    processed = 0

    while True:
      payload = fetch_page(token, page)
      results = payload.get("results", [])
      if not results:
        break

      for doc in results:
        doc_id = doc.get("id")
        if not doc_id:
          continue
        modified = doc.get("modified") or doc.get("added") or ""
        if state.get(str(doc_id)) == modified:
          continue

        details = fetch_document(token, doc_id)
        content = details.get("content")
        if not content:
          content = fetch_text_fallback(token, doc_id)
        if not content:
          continue

        title = details.get("title") or f"paperless-{doc_id}"
        filename = sanitize(f"{doc_id}-{title}") + ".txt"
        (OUTPUT_DIR / filename).write_text(content, encoding="utf-8")

        try:
          push_to_open_webui(title, content)
        except requests.RequestException as exc:
          print(f"Open WebUI ingest failed for {doc_id}: {exc}")

        state[str(doc_id)] = modified
        processed += 1

      if not payload.get("next"):
        break
      page += 1

    save_state(state)
    print(f"Processed {processed} documents")
