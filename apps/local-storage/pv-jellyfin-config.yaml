apiVersion: v1
kind: PersistentVolume
metadata:
  name: perun-jellyfin-config-local
spec:
  capacity:
    storage: 25Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-local
  claimRef:
    namespace: transmission
    name: jellyfin-config-local
  hostPath:
    path: /var/lib/k8s-local-storage/transmission/jellyfin-config
    type: DirectoryOrCreate
