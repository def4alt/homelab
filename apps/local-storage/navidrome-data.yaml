apiVersion: v1
kind: PersistentVolume
metadata:
  name: navidrome-data
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-local
  claimRef:
    namespace: navidrome
    name: navidrome-data
  hostPath:
    path: /var/lib/k8s-local-storage/navidrome/data
    type: DirectoryOrCreate
