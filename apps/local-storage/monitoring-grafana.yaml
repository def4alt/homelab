apiVersion: v1
kind: PersistentVolume
metadata:
  name: monitoring-grafana
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-local
  claimRef:
    namespace: infra
    name: monitoring-grafana
  hostPath:
    path: /var/lib/k8s-local-storage/infra/monitoring-grafana
    type: DirectoryOrCreate
