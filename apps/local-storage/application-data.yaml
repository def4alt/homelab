apiVersion: v1
kind: PersistentVolume
metadata:
  name: perun-authentik-db-local
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-local
  claimRef:
    namespace: authentik
    name: authentik-db-1
  hostPath:
    path: /var/lib/k8s-local-storage/authentik/authentik-db
    type: DirectoryOrCreate
---
