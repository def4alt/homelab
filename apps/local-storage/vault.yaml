apiVersion: v1
kind: PersistentVolume
metadata:
  name: vault-mcp-data
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-local
  claimRef:
    namespace: vault
    name: vault-mcp-data
  hostPath:
    path: /var/lib/k8s-local-storage/vault/mcp
    type: DirectoryOrCreate
