apiVersion: v1
kind: PersistentVolume
metadata:
  name: perun-linkding-data-local
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-local
  claimRef:
    namespace: linkding
    name: linkding-data
  hostPath:
    path: /var/lib/k8s-local-storage/linkding/data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: perun-loki-data-local
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-local
  claimRef:
    namespace: infra
    name: loki-data
  hostPath:
    path: /var/lib/k8s-local-storage/infra/loki
    type: DirectoryOrCreate
