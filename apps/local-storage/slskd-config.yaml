apiVersion: v1
kind: PersistentVolume
metadata:
  name: slskd-config
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-local
  claimRef:
    namespace: transmission
    name: slskd-config
  hostPath:
    path: /var/lib/k8s-local-storage/transmission/slskd-config
    type: DirectoryOrCreate
