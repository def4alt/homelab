apiVersion: v1
kind: PersistentVolume
metadata:
  name: perun-prowlarr-config-local
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-local
  claimRef:
    namespace: transmission
    name: prowlarr-config-local
  hostPath:
    path: /var/lib/k8s-local-storage/transmission/prowlarr-config
    type: DirectoryOrCreate
