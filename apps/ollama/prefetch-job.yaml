apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-prefetch-models
  namespace: ai
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ollama-prefetch
          image: ollama/ollama:latest
          env:
            - name: OLLAMA_HOST
              value: http://ollama.ai.svc.cluster.local:11434
          command:
            - /bin/sh
            - -c
            - |
              ollama pull gemma3:4b
              ollama pull embeddinggemma
