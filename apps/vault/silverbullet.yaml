apiVersion: apps/v1
kind: Deployment
metadata:
  name: silverbullet
  namespace: vault
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: silverbullet
  template:
    metadata:
      labels:
        app: silverbullet
    spec:
      containers:
        - name: silverbullet
          # -slim: no headless Chromium; the Runtime API isn't used.
          image: ghcr.io/silverbulletmd/silverbullet:2.12.1-slim@sha256:7e24c16d31a3f4b4a4832ed64ec585e605a1e275b7c35917d385176f0b40415c
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: SB_INDEX_PAGE
              value: index
            - name: SB_USER
              valueFrom:
                secretKeyRef:
                  name: vault
                  key: silverbullet-user
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: vault
              mountPath: /space
      volumes:
        - name: vault
          hostPath:
            # Canonical vault checkout (git repo); also synced to the Mac by Syncthing.
            path: /srv/vault
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: silverbullet
  namespace: vault
spec:
  selector:
    app: silverbullet
  ports:
    - name: http
      port: 3000
      targetPort: 3000
