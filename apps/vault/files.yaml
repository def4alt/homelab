# files.def4alt.com: nginx serves documents and vault blobs and accepts uploads, but only through
# links signed by vault-mcp (secure_link, shared secret). Everything else is 403/404.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-files
  namespace: vault
data:
  default.conf: |
    # files.def4alt.com through the Cloudflare tunnel: Cloudflare caps request bodies at 100 MB.
    server {
        listen 8080 default_server;
        server_tokens off;
        client_max_body_size 95m;
        include /etc/nginx/vault/common.conf;
    }

    # vault-files.def4alt.com on the tailnet (agents with a shell, e.g. Hermes): no Cloudflare in the path.
    server {
        listen 8080;
        server_name vault-files.def4alt.com;
        server_tokens off;
        client_max_body_size 4g;
        include /etc/nginx/vault/common.conf;
    }
  common.conf: |
    include /etc/nginx/secret/link.conf;  # set $link_secret "...";
    # Same filesystem as the inbox, so a finished upload is an atomic rename.
    client_body_temp_path /inbox/.tmp;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Hidden files and folders (.inbox, .stversions, ...) are never served.
    location ~ /\. { return 404; }

    location /d/ {
        secure_link $arg_s,$arg_e;
        secure_link_md5 "$secure_link_expires$uri $link_secret";
        if ($secure_link = "") { return 403; }
        if ($secure_link = "0") { return 410; }
        limit_except GET { deny all; }
        alias /documents/;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Vault blobs, served under their original file name (n, part of the signature).
    location ~ "^/b/(?<blob>[0-9a-f]{16,64}(\.[a-z0-9]{1,10})?)$" {
        secure_link $arg_s,$arg_e;
        secure_link_md5 "$secure_link_expires$uri$arg_n $link_secret";
        if ($secure_link = "") { return 403; }
        if ($secure_link = "0") { return 410; }
        limit_except GET { deny all; }
        alias /blobs/$blob;
        add_header Content-Disposition "inline; filename*=UTF-8''$arg_n" always;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ "^/u/(?<upload_id>[a-z0-9-]{8,64})/$" {
        secure_link $arg_s,$arg_e;
        secure_link_md5 "$secure_link_expires/u/$upload_id $link_secret";
        if ($secure_link = "") { return 403; }
        if ($secure_link = "0") { return 410; }
        root /etc/nginx/html;
        try_files /upload.html =404;
    }

    location ~ "^/u/(?<upload_id>[a-z0-9-]{8,64})/(?<file_name>[^/.][^/]*)$" {
        # The upload widget runs in the chat client's sandboxed iframe, so its PUT is cross-origin.
        # The signed URL is the only credential (no cookies), so any origin may use it.
        add_header Access-Control-Allow-Origin "*" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "PUT, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            add_header Access-Control-Max-Age 3600;
            return 204;
        }
        secure_link $arg_s,$arg_e;
        secure_link_md5 "$secure_link_expires/u/$upload_id $link_secret";
        if ($secure_link = "") { return 403; }
        if ($secure_link = "0") { return 410; }
        limit_except PUT { deny all; }
        alias /inbox/$upload_id/$file_name;
        dav_methods PUT;
        dav_access user:rw group:rw all:r;
        create_full_put_path off;  # only inbox dirs created by vault-mcp accept files
    }

    location / { return 404; }
  upload.html: |
    <!doctype html>
    <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Share files with your agents</title>
    <style>
      :root{--bg:#fafaf9;--fg:#1c1917;--muted:#78716c;--line:#d6d3d1;--accent:#2563eb}
      @media (prefers-color-scheme:dark){:root{--bg:#1c1917;--fg:#f5f5f4;--muted:#a8a29e;--line:#44403c;--accent:#60a5fa}}
      body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
      main{max-width:34rem;margin:12vh auto;padding:0 16px}
      label{display:block;border:2px dashed var(--line);border-radius:12px;padding:3rem 1rem;text-align:center;cursor:pointer}
      label.over{border-color:var(--accent)} input{display:none} p{color:var(--muted)}
      li{display:flex;justify-content:space-between;gap:1rem;padding:.4rem 0;border-bottom:1px solid var(--line)}
      ul{list-style:none;padding:0}
    </style></head>
    <body><main>
      <h1>Share files with your agents</h1>
      <p>Files land in the shared space and every agent can read them within a minute. Up to 95 MB each.</p>
      <label id="drop">Drop files here or click to choose<input id="pick" type="file" multiple></label>
      <ul id="list"></ul>
    </main>
    <script>
      const list = document.getElementById("list"), drop = document.getElementById("drop");
      function send(file) {
        const li = document.createElement("li"), state = document.createElement("span");
        li.textContent = file.name; li.append(state); list.append(li);
        const name = file.name.replace(/[\/\\]/g, "-").replace(/^\.+/, "") || "file";
        const xhr = new XMLHttpRequest();
        xhr.open("PUT", location.pathname + encodeURIComponent(name) + location.search);
        xhr.upload.onprogress = e => { if (e.lengthComputable) state.textContent = Math.round(100 * e.loaded / e.total) + "%"; };
        xhr.onload = () => { state.textContent = xhr.status < 300 ? "done" : xhr.status === 413 ? "too large" : xhr.status === 410 ? "link expired" : "failed (" + xhr.status + ")"; };
        xhr.onerror = () => { state.textContent = "failed"; };
        xhr.send(file);
      }
      document.getElementById("pick").onchange = e => [...e.target.files].forEach(send);
      drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
      drop.ondragleave = () => drop.classList.remove("over");
      drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); [...e.dataTransfer.files].forEach(send); };
    </script></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-files
  namespace: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-files
  template:
    metadata:
      labels:
        app: vault-files
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # uploads must be owned by the same user as the worker
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.30.4-alpine@sha256:adf5042a17f4ecdd200c595fa9ffd1be37efb18f89a830bd1a00e4ab4d59d42c
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: config
              mountPath: /etc/nginx/vault/common.conf
              subPath: common.conf
            - name: config
              mountPath: /etc/nginx/html/upload.html
              subPath: upload.html
            - name: secret
              mountPath: /etc/nginx/secret
              readOnly: true
            - name: documents
              mountPath: /documents
              readOnly: true
            - name: inbox
              mountPath: /inbox
            - name: blobs
              mountPath: /blobs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: vault-files
        - name: secret
          secret:
            secretName: vault-files
            items:
              - key: link.conf
                path: link.conf
        - name: documents
          hostPath:
            path: /srv/documents
            type: Directory
        - name: inbox
          hostPath:
            path: /srv/documents/.inbox
            type: DirectoryOrCreate
        - name: blobs
          hostPath:
            path: /srv/vault/blobs
            type: Directory
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vault-files
  namespace: vault
spec:
  selector:
    app: vault-files
  ports:
    - name: http
      port: 8080
      targetPort: http
