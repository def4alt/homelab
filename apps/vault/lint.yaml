# Weekly vault lint: writes notes/lint-YYYY-MM-DD.md and a log line. Report only;
# the autocommit job pushes the commit.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-lint
  namespace: vault
spec:
  schedule: "0 7 * * 1"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: lint
              image: ghcr.io/def4alt/vault-mcp:0.3.0@sha256:19bd353ccc1f3046c824d0689e6edf9cda4194d2b4e435903f7ecaf45e052faa
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  cd /vault
                  today=$(date +%F)
                  flock .git/vault.lock sh -c "
                    vault-lint /vault --write > /dev/null
                    echo '- $today lint [[notes/lint-$today]]: weekly report (vault-lint)' >> log.md
                    git add notes/lint-$today.md log.md
                    git -c user.name='vault lint' -c user.email=vault-lint@def4alt.com commit -q -m 'lint: weekly report $today (vault-lint)'
                  "
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: vault
                  mountPath: /vault
          volumes:
            - name: vault
              hostPath:
                path: /srv/vault
                type: Directory
