# Worker: files uploads, fetches and the Agent/inbox drop folder into blobs/ + files/ notes,
# and keeps the SQLite search index current.
# The only workload that writes into the documents tree; it has no network access.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-worker
  namespace: vault
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vault-worker
  template:
    metadata:
      labels:
        app: vault-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # hostPath volumes ignore fsGroup: create the shared directories owned by the app user.
        - name: prepare
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - |
              set -e
              install -d -o 1000 -g 1000 -m 2775 /documents/.inbox /documents/.inbox/.done /documents/.inbox/.tmp
              install -d -o 1000 -g 1000 -m 2775 /documents/Agent/inbox
              chown 1000:1000 /cache
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE]
          volumeMounts:
            - name: documents
              mountPath: /documents
            - name: cache
              mountPath: /cache
      containers:
        - name: worker
          image: ghcr.io/def4alt/vault-mcp:0.3.1@sha256:5cb3d86700e598aa6db1d458ecfc72abf00129825c54c7d2854db2321d2986e4
          command: ["vault-worker"]
          env:
            - name: INBOX_ROOT
              value: /documents/.inbox
            - name: METRICS_PORT
              value: "9000"
          ports:
            - name: metrics
              containerPort: 9000
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 60
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m  # pdftotext on big PDFs; keep it from starving other workloads
              memory: 512Mi
          volumeMounts:
            - name: documents
              mountPath: /documents
            - name: vault
              mountPath: /vault
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: documents
          hostPath:
            path: /srv/documents
            type: Directory
        - name: vault
          hostPath:
            path: /srv/vault
            type: Directory
        - name: cache
          hostPath:
            path: /var/lib/k8s-local-storage/vault/cache
            type: DirectoryOrCreate
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
