# Commits edits made outside the MCP server (Obsidian via Syncthing, SilverBullet)
# and pushes everything to the private GitHub remote.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-autocommit
  namespace: vault
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: git
              # Same image as the MCP server: it has git, ssh and a passwd entry for uid 1000,
              # which OpenSSH requires.
              image: ghcr.io/def4alt/vault-mcp:0.1.0@sha256:da02af9cc6acb1bafd26e9510cc573f746821dc45af78a17eea8a9e687fea26c
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  export HOME=/tmp
                  git config --global --add safe.directory /vault
                  git config --global user.name "vault autocommit"
                  git config --global user.email vault-autocommit@def4alt.com
                  cd /vault
                  # Syncthing writes conflict copies; never commit them.
                  git add -A -- . ':!*.sync-conflict-*'
                  git diff --cached --quiet || git commit -q -m "autocommit: edits from Obsidian/SilverBullet"
                  git push -q origin main
              env:
                - name: GIT_SSH_COMMAND
                  value: ssh -i /ssh/deploy-key -o UserKnownHostsFile=/ssh/known_hosts -o IdentitiesOnly=yes
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: vault
                  mountPath: /vault
                - name: ssh
                  mountPath: /ssh
                  readOnly: true
          volumes:
            - name: vault
              hostPath:
                path: /srv/vault
                type: Directory
            - name: ssh
              secret:
                secretName: vault-git
                defaultMode: 0440
