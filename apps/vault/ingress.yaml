# Tailnet-only hostnames: DNS points at perun's Tailscale address (see cloudflare/locals.tf).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault
  namespace: vault
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: notes.def4alt.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: silverbullet
                port:
                  number: 3000
    - host: vault.def4alt.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault-mcp
                port:
                  number: 8000
    # Signed file links and uploads for tailnet agents (4 GB bodies instead of Cloudflare's 100 MB).
    - host: vault-files.def4alt.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault-files
                port:
                  number: 8080
  tls:
    - secretName: vault-tls
      hosts:
        - notes.def4alt.com
        - vault.def4alt.com
        - vault-files.def4alt.com
---
# Public MCP endpoint for Claude.ai and ChatGPT, reached through the Cloudflare tunnel.
# Only GitHub OAuth (def4alt) is accepted here; the Hermes bearer token is refused on this host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault-mcp-public
  namespace: vault
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: mcp.def4alt.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault-mcp
                port:
                  number: 8000
  tls:
    - secretName: vault-mcp-public-tls
      hosts:
        - mcp.def4alt.com
---
# Public file links (Cloudflare tunnel). nginx only answers signed /d/ and /u/ URLs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault-files
  namespace: vault
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: files.def4alt.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault-files
                port:
                  number: 8080
  tls:
    - secretName: vault-files-tls
      hosts:
        - files.def4alt.com
