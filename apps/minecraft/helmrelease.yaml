apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft
  namespace: minecraft
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: minecraft
      version: 5.1.2
      sourceRef:
        kind: HelmRepository
        name: minecraft
        namespace: minecraft
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2
        memory: 4Gi
    startupProbe:
      enabled: true
      failureThreshold: 60
      periodSeconds: 10
    extraEnv:
      TZ: Europe/Berlin
    persistence:
      dataDir:
        enabled: true
        accessModes:
          - ReadWriteOnce
        Size: 20Gi
        storageClass: longhorn
    minecraftServer:
      eula: "TRUE"
      type: PAPER
      version: LATEST
      memory: 3G
      serviceType: LoadBalancer
      servicePort: 25565
      loadBalancerIP: 192.168.88.194
