apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: infra
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 87.17.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: infra
  values:
    alertmanager:
      alertmanagerSpec:
        useExistingSecret: true
        configSecret: monitoring-alertmanager
    grafana:
      admin:
        existingSecret: monitoring-grafana
      additionalDataSources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki.infra.svc.cluster.local:3100
          isDefault: false
          editable: false
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: infra-authentik-forward-auth@kubernetescrd
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - grafana.def4alt.com
        path: /
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.def4alt.com
      persistence:
        enabled: true
        existingClaim: monitoring-grafana
    prometheus:
      prometheusSpec:
        retention: 3d
        resources:
          requests:
            cpu: 150m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        podMonitorSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorNamespaceSelector: {}
        podMonitorNamespaceSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: {}
        serviceMonitorNamespaceSelectorNilUsesHelmValues: false
        ruleSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleNamespaceSelector: {}
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: manual-local
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 25Gi
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
