apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: infra
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: infra
  values:
    grafana:
      admin:
        existingSecret: monitoring-grafana
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
      ingress:
        enabled: true
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: infra-authentik-forward-auth@kubernetescrd
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - grafana.def4alt.com
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.def4alt.com
      persistence:
        enabled: true
        storageClassName: longhorn
        accessModes:
          - ReadWriteOnce
        size: 5Gi
    prometheus:
      ingress:
        enabled: true
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: infra-authentik-forward-auth@kubernetescrd
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - prometheus.def4alt.com
        tls:
          - secretName: prometheus-tls
            hosts:
              - prometheus.def4alt.com
      prometheusSpec:
        retention: 7d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 25Gi
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
