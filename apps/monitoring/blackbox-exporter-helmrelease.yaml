apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: infra
spec:
  interval: 10m
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: 11.15.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: infra
  values:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - HTTP/1.1
              - HTTP/2.0
            follow_redirects: true
            preferred_ip_protocol: ip4
        dns_udp:
          prober: dns
          timeout: 5s
          dns:
            transport_protocol: udp
            preferred_ip_protocol: ip4
            query_name: auth.def4alt.com
            query_type: A
    serviceMonitor:
      selfMonitor:
        enabled: true
      enabled: true
      defaults:
        interval: 30s
        scrapeTimeout: 30s
        module: http_2xx
      targets:
        - name: blog
          url: https://def4alt.com/
          hostname: def4alt.com
        - name: auth
          url: https://auth.def4alt.com/
          hostname: auth.def4alt.com
        - name: pihole
          url: https://pihole.def4alt.com/admin/
          hostname: pihole.def4alt.com
        - name: home-assistant
          url: https://home.def4alt.com/
          hostname: home.def4alt.com
        - name: immich
          url: https://photos.def4alt.com/
          hostname: photos.def4alt.com
        - name: glance
          url: https://dashboard.def4alt.com/
          hostname: dashboard.def4alt.com
        - name: paperless
          url: https://papers.def4alt.com/
          hostname: papers.def4alt.com
        - name: linkding
          url: https://links.def4alt.com/
          hostname: links.def4alt.com
        - name: grafana
          url: https://grafana.def4alt.com/
          hostname: grafana.def4alt.com
        - name: jellyfin
          url: https://tv.def4alt.com/
          hostname: tv.def4alt.com
        - name: transmission
          url: https://sea.def4alt.com/
          hostname: sea.def4alt.com
        - name: internal-linkding
          url: http://linkding.linkding.svc.cluster.local/
        - name: internal-grafana
          url: http://monitoring-grafana.infra.svc.cluster.local/api/health
        - name: internal-prometheus
          url: http://monitoring-kube-prometheus-prometheus.infra.svc.cluster.local:9090/-/ready
        - name: internal-loki
          url: http://loki.infra.svc.cluster.local:3100/ready
        - name: internal-alloy
          url: http://alloy.infra.svc.cluster.local:12345/-/ready
        - name: pihole-dns
          url: 192.168.88.192:53
          module: dns_udp
    prometheusRule:
      enabled: false
