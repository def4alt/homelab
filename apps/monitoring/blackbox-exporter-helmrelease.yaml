apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: infra
spec:
  interval: 10m
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: infra
  values:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    serviceMonitor:
      selfMonitor:
        enabled: true
      enabled: true
      defaults:
        interval: 30s
        scrapeTimeout: 30s
        module: http_2xx
      targets:
        - name: blog
          url: https://def4alt.com/
          hostname: def4alt.com
        - name: auth
          url: https://auth.def4alt.com/
          hostname: auth.def4alt.com
        - name: pihole
          url: https://pihole.def4alt.com/admin/
          hostname: pihole.def4alt.com
        - name: home-assistant
          url: https://home.def4alt.com/
          hostname: home.def4alt.com
        - name: immich
          url: https://photos.def4alt.com/
          hostname: photos.def4alt.com
        - name: immich-api
          url: https://api-photos.def4alt.com/
          hostname: api-photos.def4alt.com
        - name: glance
          url: https://dashboard.def4alt.com/
          hostname: dashboard.def4alt.com
        - name: executor
          url: https://executor.def4alt.com/
          hostname: executor.def4alt.com
        - name: kaneo
          url: https://projects.def4alt.com/
          hostname: projects.def4alt.com
        - name: paperless
          url: https://papers.def4alt.com/
          hostname: papers.def4alt.com
    prometheusRule:
      enabled: false
