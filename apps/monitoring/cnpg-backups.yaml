              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "time() - max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Time Since Last Successful Backup",
          "type": "stat"
        }
