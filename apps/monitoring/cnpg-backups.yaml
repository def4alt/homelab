            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "max(barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp) * 1000",
