apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: immich-juicefs
provisioner: csi.juicefs.com
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  csi.storage.k8s.io/provisioner-secret-name: juicefs-auth
  csi.storage.k8s.io/provisioner-secret-namespace: juicefs
  csi.storage.k8s.io/node-publish-secret-name: juicefs-auth
  csi.storage.k8s.io/node-publish-secret-namespace: juicefs
