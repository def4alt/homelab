apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: juicefs-db-local
  namespace: juicefs
spec:
  instances: 1
  bootstrap:
    initdb:
      database: juicefs
      owner: juicefs
      secret:
        name: juicefs-auth
  storage:
    size: 10Gi
    storageClass: manual-local
  monitoring:
    enablePodMonitor: true
