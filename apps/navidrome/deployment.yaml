apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: navidrome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      initContainers:
        - name: download-plugin
          image: curlimages/curl:8.12.1
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /plugins
              curl -fsSLo /plugins/listenbrainz-daily-playlist.ndp \
                https://github.com/kgarner7/navidrome-listenbrainz-daily-playlist/releases/download/v6.0.0/listenbrainz-daily-playlist.ndp
              echo "Plugin downloaded"
          volumeMounts:
            - name: plugins
              mountPath: /plugins
      containers:
        - name: navidrome
          image: deluan/navidrome:0.63.2
          env:
            - name: ND_MUSICFOLDER
              value: /music
            - name: ND_DATAFOLDER
              value: /data
            - name: ND_PORT
              value: "4533"
            - name: ND_LASTFM_ENABLED
              value: "false"
            - name: ND_LISTENBRAINZ_ENABLED
              value: "true"
            - name: ND_LISTENBRAINZ_BASEURL
              value: https://api.listenbrainz.org
            - name: ND_PLUGINS_ENABLED
              value: "true"
            - name: ND_PLUGINSFOLDER
              value: /plugins
            - name: ND_LOGLEVEL
              value: info
            - name: TZ
              value: Europe/Berlin
          ports:
            - name: http
              containerPort: 4533
          readinessProbe:
            tcpSocket:
              port: 4533
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4533
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: music
              mountPath: /music
            - name: data
              mountPath: /data
            - name: plugins
              mountPath: /plugins
      volumes:
        - name: music
          persistentVolumeClaim:
            claimName: navidrome-music
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data
        - name: plugins
          emptyDir: {}
