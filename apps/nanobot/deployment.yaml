apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanobot
  namespace: ai
  annotations:
    fluxcd.io/automated: "true"
    fluxcd.io/watch: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nanobot
  template:
    metadata:
      labels:
        app: nanobot
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: vault-init
          image: alpine/git:2.45.2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              rm -rf /data/home/vault
              git clone --branch "${OBSIDIAN_VAULT_BRANCH}" --depth 1 "https://x-access-token:${GITHUB_PAT}@github.com/def4alt/vault" /data/home/vault
              git -C /data/home/vault remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/def4alt/vault"
              git -C /data/home/vault fetch origin "${OBSIDIAN_VAULT_BRANCH}"
              git -C /data/home/vault reset --hard "origin/${OBSIDIAN_VAULT_BRANCH}"
              touch /data/home/vault/.nanobot-ready
          env:
            - name: HOME
              value: /data/home
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: nanobot-secrets
                  key: github-pat
            - name: OBSIDIAN_VAULT_REPO
              valueFrom:
                configMapKeyRef:
                  name: nanobot-config
                  key: obsidian-vault-repo
            - name: OBSIDIAN_VAULT_BRANCH
              valueFrom:
                configMapKeyRef:
                  name: nanobot-config
                  key: obsidian-vault-branch
            - name: OBSIDIAN_VAULT_READY_PATH
              value: /data/home/vault/.nanobot-ready
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data/home
      containers:
        - name: nanobot
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /data/home/.nanobot/workspace
              mkdir -p /data/home/.nanobot/venv

              if [ ! -x /data/home/.nanobot/venv/bin/nanobot ]; then
                python -m venv /data/home/.nanobot/venv
              fi

              /data/home/.nanobot/venv/bin/pip install --no-cache-dir -U nanobot-ai mcp

              mkdir -p /data/home/.nanobot/bin
              if [ ! -x /data/home/.nanobot/bin/rg ]; then
                python - <<'PY'
                import io
                import os
                import platform
                import tarfile
                import urllib.request

                version = "14.1.1"
                machine = platform.machine().lower()
                if machine in {"x86_64", "amd64"}:
                    target = "x86_64-unknown-linux-musl"
                elif machine in {"aarch64", "arm64"}:
                    target = "aarch64-unknown-linux-musl"
                else:
                    raise SystemExit(f"unsupported architecture: {machine}")

                url = (
                    f"https://github.com/BurntSushi/ripgrep/releases/download/{version}/"
                    f"ripgrep-{version}-{target}.tar.gz"
                )
                archive = urllib.request.urlopen(url, timeout=60).read()
                with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as tar:
                    member = next((item for item in tar.getmembers() if item.name.endswith("/rg")), None)
                    if member is None:
                        raise SystemExit("ripgrep archive did not contain an rg binary")
                    extracted = tar.extractfile(member)
                    if extracted is None:
                        raise SystemExit("could not extract rg binary from archive")
                    output = "/data/home/.nanobot/bin/rg"
                    with open(output, "wb") as handle:
                        handle.write(extracted.read())
                os.chmod(output, 0o755)
                PY
              fi
              export PATH="/data/home/.nanobot/bin:$PATH"

              python - <<'PY'
              import json
              import os
              from pathlib import Path

              allowed_id = os.environ.get("TELEGRAM_ALLOWED_ID", "").strip()
              allow_from = [allowed_id] if allowed_id else []

              config = {
                  "providers": {
                      "openrouter": {
                          "apiKey": os.environ.get("OPENROUTER_API_KEY", ""),
                      },
                      "custom": {
                          "apiKey": os.environ.get("VENICE_API_KEY", ""),
                          "apiBase": "https://api.venice.ai/api/v1",
                      },
                  },
                  "agents": {
                      "defaults": {
                          "provider": "custom",
                          "model": os.environ.get("NANOBOT_MODEL", "google-gemma-4-31b-it"),
                          "workspace": "/data/home/.nanobot/workspace",
                      }
                  },
                  "tools": {
                      "restrictToWorkspace": True,
                      "web": {
                          "search": {
                              "provider": "brave",
                              "apiKey": os.environ.get("BRAVE_API_KEY", ""),
                          }
                      },
                      "mcpServers": {
                          "obsidian": {
                              "command": "/data/home/.nanobot/venv/bin/python",
                              "args": ["/opt/obsidian_rag_mcp.py"],
                              "env": {
                                  "OPENROUTER_API_KEY": os.environ.get("OPENROUTER_API_KEY", ""),
                                  "OPENROUTER_REFERER": os.environ.get("OBSIDIAN_OPENROUTER_REFERER", "https://github.com/def4alt/homelab"),
                                  "OPENROUTER_TITLE": os.environ.get("OBSIDIAN_OPENROUTER_TITLE", "nanobot-obsidian-rag"),
                                  "OBSIDIAN_EMBEDDING_MODEL": os.environ.get("OBSIDIAN_EMBEDDING_MODEL", "qwen/qwen3-embedding-8b"),
                                  "OBSIDIAN_VAULT_PATH": "/data/home/vault",
                                  "OBSIDIAN_INDEX_PATH": "/data/home/.nanobot/obsidian-rag/index.sqlite3",
                                  "OBSIDIAN_VAULT_READY_PATH": "/data/home/vault/.nanobot-ready",
                                  "OBSIDIAN_DEFAULT_TOP_K": os.environ.get("OBSIDIAN_DEFAULT_TOP_K", "5"),
                                  "OBSIDIAN_SYNC_PERIOD_SECONDS": os.environ.get("OBSIDIAN_SYNC_PERIOD_SECONDS", "300"),
                                  "OBSIDIAN_RG_BIN": os.environ.get("OBSIDIAN_RG_BIN", "/data/home/.nanobot/bin/rg"),
                              },
                              "enabledTools": [
                                  "search_notes",
                                  "read_note",
                                  "write_note",
                                  "append_note",
                                  "refresh_index",
                              ],
                              "toolTimeout": 900,
                          }
                      },
                  },
                  "channels": {
                      "telegram": {
                          "enabled": True,
                          "token": os.environ.get("TELEGRAM_BOT_TOKEN", ""),
                          "allowFrom": allow_from,
                          "groupPolicy": "mention",
                      }
                  },
              }

              Path("/data/home/.nanobot/config.json").write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")

              soul_template = Path("/opt/nanobot-soul.md").read_text(encoding="utf-8").strip()
              soul_path = Path("/data/home/.nanobot/workspace/SOUL.md")
              marker_start = "<!-- nanobot-managed-obsidian:start -->"
              marker_end = "<!-- nanobot-managed-obsidian:end -->"
              managed_block = f"{marker_start}\n{soul_template}\n{marker_end}"

              current_soul = soul_path.read_text(encoding="utf-8") if soul_path.exists() else ""
              if marker_start in current_soul and marker_end in current_soul:
                  prefix, remainder = current_soul.split(marker_start, 1)
                  _, suffix = remainder.split(marker_end, 1)
                  pieces = [piece for piece in [prefix.rstrip(), managed_block, suffix.lstrip()] if piece]
                  soul_path.write_text("\n\n".join(pieces) + "\n", encoding="utf-8")
              elif current_soul.strip():
                  soul_path.write_text(current_soul.rstrip() + "\n\n" + managed_block + "\n", encoding="utf-8")
              else:
                  soul_path.write_text(managed_block + "\n", encoding="utf-8")
              PY

              exec /data/home/.nanobot/venv/bin/nanobot gateway
          env:
            - name: HOME
              value: /data/home
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nanobot-secrets
                  key: openrouter-api-key
                  optional: true
            - name: VENICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nanobot-secrets
                  key: venice-api-key
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nanobot-secrets
                  key: telegram-bot-token
            - name: TELEGRAM_ALLOWED_ID
              valueFrom:
                secretKeyRef:
                  name: nanobot-secrets
                  key: telegram-allowed-id
            - name: BRAVE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nanobot-secrets
                  key: brave-api-key
            - name: NANOBOT_MODEL
              valueFrom:
                configMapKeyRef:
                  name: nanobot-config
                  key: model
            - name: OBSIDIAN_VAULT_REPO
              valueFrom:
                configMapKeyRef:
                  name: nanobot-config
                  key: obsidian-vault-repo
            - name: OBSIDIAN_VAULT_BRANCH
              valueFrom:
                configMapKeyRef:
                  name: nanobot-config
                  key: obsidian-vault-branch
            - name: OBSIDIAN_EMBEDDING_MODEL
              valueFrom:
                configMapKeyRef:
                  name: nanobot-config
                  key: obsidian-embedding-model
            - name: OBSIDIAN_SYNC_PERIOD_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: nanobot-config
                  key: obsidian-sync-period-seconds
            - name: OBSIDIAN_VAULT_PATH
              value: /data/home/vault
            - name: OBSIDIAN_INDEX_PATH
              value: /data/home/.nanobot/obsidian-rag/index.sqlite3
            - name: OBSIDIAN_DEFAULT_TOP_K
              valueFrom:
                configMapKeyRef:
                  name: nanobot-config
                  key: obsidian-default-top-k
          ports:
            - name: http
              containerPort: 18790
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /data/home/.nanobot/config.json && test -x /data/home/.nanobot/venv/bin/nanobot
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  python - <<'PY'
                  import pathlib
                  import sys

                  cmdline = pathlib.Path('/proc/1/cmdline').read_bytes().replace(b'\x00', b' ')
                  sys.exit(0 if (b'nanobot' in cmdline and b'gateway' in cmdline) else 1)
                  PY
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  python - <<'PY'
                  import pathlib
                  import sys

                  cmdline = pathlib.Path('/proc/1/cmdline').read_bytes().replace(b'\x00', b' ')
                  sys.exit(0 if (b'nanobot' in cmdline and b'gateway' in cmdline) else 1)
                  PY
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data/home
            - name: tmp
              mountPath: /tmp
            - name: obsidian-rag-script
              mountPath: /opt/obsidian_rag_mcp.py
              subPath: obsidian_rag_mcp.py
            - name: nanobot-soul
              mountPath: /opt/nanobot-soul.md
              subPath: soul.md
        - name: vault-sync
          image: alpine/git:2.45.2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              rm -rf /data/home/vault
              git clone --branch "${OBSIDIAN_VAULT_BRANCH}" --depth 1 "https://x-access-token:${GITHUB_PAT}@github.com/def4alt/vault" /data/home/vault
              git -C /data/home/vault remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/def4alt/vault"

              touch /data/home/vault/.nanobot-ready

              while true; do
                git -C /data/home/vault fetch origin "${OBSIDIAN_VAULT_BRANCH}"
                git -C /data/home/vault reset --hard "origin/${OBSIDIAN_VAULT_BRANCH}"
                touch /data/home/vault/.nanobot-ready
                sleep "${OBSIDIAN_SYNC_PERIOD_SECONDS}"
              done
          env:
            - name: HOME
              value: /data/home
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: nanobot-secrets
                  key: github-pat
            - name: OBSIDIAN_VAULT_REPO
              valueFrom:
                configMapKeyRef:
                  name: nanobot-config
                  key: obsidian-vault-repo
            - name: OBSIDIAN_VAULT_BRANCH
              valueFrom:
                configMapKeyRef:
                  name: nanobot-config
                  key: obsidian-vault-branch
            - name: OBSIDIAN_SYNC_PERIOD_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: nanobot-config
                  key: obsidian-sync-period-seconds
            - name: OBSIDIAN_VAULT_READY_PATH
              value: /data/home/vault/.nanobot-ready
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data/home
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nanobot-data
        - name: tmp
          emptyDir: {}
        - name: obsidian-rag-script
          configMap:
            name: nanobot-obsidian-rag
            defaultMode: 0444
        - name: nanobot-soul
          configMap:
            name: nanobot-soul
            defaultMode: 0444
