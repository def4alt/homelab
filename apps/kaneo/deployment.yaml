apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaneo
  namespace: kaneo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kaneo
  template:
    metadata:
      labels:
        app: kaneo
    spec:
      containers:
        - name: api
          image: ghcr.io/usekaneo/api:latest
          imagePullPolicy: Always
          env:
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: kaneo-secrets
                  key: auth-secret
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: kaneo-secrets
                  key: auth-secret
            - name: BETTER_AUTH_URL
              value: https://projects.def4alt.com
            - name: KANEO_API_URL
              value: https://projects.def4alt.com
            - name: KANEO_CLIENT_URL
              value: https://projects.def4alt.com
            - name: CORS_ORIGINS
              value: https://projects.def4alt.com
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kaneo-secrets
                  key: database-url
            - name: DISABLE_REGISTRATION
              value: "false"
            - name: DISABLE_PASSWORD_REGISTRATION
              value: "false"
          ports:
            - name: api
              containerPort: 1337
          startupProbe:
            httpGet:
              path: /api/health
              port: api
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health
              port: api
          livenessProbe:
            httpGet:
              path: /api/health
              port: api
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: web
          image: ghcr.io/usekaneo/web:latest
          imagePullPolicy: Always
          env:
            - name: KANEO_API_URL
              value: https://projects.def4alt.com
          ports:
            - name: web
              containerPort: 5173
          readinessProbe:
            httpGet:
              path: /
              port: web
          livenessProbe:
            httpGet:
              path: /
              port: web
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
