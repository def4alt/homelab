apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: piped-db
  namespace: piped
spec:
  instances: 1
  bootstrap:
    initdb:
      database: piped
      owner: piped
      secret:
        name: piped-db-auth
  storage:
    size: 10Gi
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-barman-s3
