apiVersion: apps/v1
kind: Deployment
metadata:
  name: piped-backend
  namespace: piped
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: piped-backend
  template:
    metadata:
      labels:
        app: piped-backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gluetun
          image: qmcgaw/gluetun@sha256:b0ee2135e6ba52ad3f102aae9663707cd1c9531485117067a380d3b2b6dd991d
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          env:
            - name: TZ
              value: Europe/Berlin
            - name: VPN_SERVICE_PROVIDER
              value: custom
            - name: VPN_TYPE
              value: wireguard
            - name: WIREGUARD_MTU
              value: "1440"
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
            - name: HEALTH_TARGET_ADDRESSES
              value: "1.1.1.1:443,1.0.0.1:443"
            - name: HEALTH_ICMP_TARGET_IPS
              value: "1.1.1.1,1.0.0.1"
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: piped-wireguard
                  key: wireguard-private-key
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: piped-wireguard
                  key: wireguard-addresses
            - name: WIREGUARD_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: piped-wireguard
                  key: wireguard-public-key
            - name: WIREGUARD_ENDPOINT_IP
              valueFrom:
                secretKeyRef:
                  name: piped-wireguard
                  key: wireguard-endpoint-ip
            - name: WIREGUARD_ENDPOINT_PORT
              valueFrom:
                secretKeyRef:
                  name: piped-wireguard
                  key: wireguard-endpoint-port
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        - name: piped-backend
          image: ghcr.io/teampiped/piped-backend:latest
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: piped-db-auth
                  key: password
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /app/config.properties
              subPath: config.properties
      volumes:
        - name: config
          configMap:
            name: piped-backend-config
