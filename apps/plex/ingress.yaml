apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plex
  namespace: transmission
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: tv-plex.def4alt.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plex
                port:
                  number: 32400
  tls:
    - secretName: plex-tls
      hosts:
        - tv-plex.def4alt.com
