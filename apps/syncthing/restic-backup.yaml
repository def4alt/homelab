apiVersion: batch/v1
kind: CronJob
metadata:
  name: documents-restic-backup
  namespace: syncthing
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: restic
              image: restic/restic:0.19.1@sha256:08916bcda4a4435f9d9828ebb4e91bb7ada3d2c8a53699788930e0ae1bd4fa67
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  restic snapshots >/dev/null 2>&1 || restic init
                  restic backup /documents \
                    --host perun \
                    --tag documents \
                    --exclude '**/.stversions' \
                    --exclude '**/.DS_Store' \
                    --exclude '**/.stfolder'
                  restic forget --keep-daily 7 --keep-weekly 4 --keep-monthly 12 --prune
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-003.backblazeb2.com/def4alt-homelab-documents
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: documents-restic-secret
                      key: RESTIC_PASSWORD
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: documents-restic-secret
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: documents-restic-secret
                      key: AWS_SECRET_ACCESS_KEY
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: documents
                  mountPath: /documents
                  readOnly: true
          volumes:
            - name: documents
              hostPath:
                path: /srv/documents
                type: Directory
