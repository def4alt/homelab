# Monthly restore drill: a backup only counts once it has been restored.
# Restores the latest vault snapshot from B2 into scratch space, checks a sample of
# the repository's data, and proves the restored git HEAD exists in the live vault.
# A failure shows up as KubeJobFailed in Alertmanager.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-restore-drill
  namespace: syncthing
spec:
  schedule: "0 5 1 * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: restore
              image: restic/restic:0.19.1@sha256:08916bcda4a4435f9d9828ebb4e91bb7ada3d2c8a53699788930e0ae1bd4fa67
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  restic check --read-data-subset=5%
                  restic restore latest --host zorya --tag zorya --target /restore
              env:
                - name: HOME
                  value: /restore
                - name: RESTIC_CACHE_DIR
                  value: /restore/.cache
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-003.backblazeb2.com/def4alt-homelab-documents
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: documents-restic-secret
                      key: RESTIC_PASSWORD
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: documents-restic-secret
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: documents-restic-secret
                      key: AWS_SECRET_ACCESS_KEY
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: restore
                  mountPath: /restore
          containers:
            - name: verify
              image: ghcr.io/def4alt/vault-mcp:0.4.1@sha256:96660e6063debb6818cb7578f765953a6f0b93c539da6bc9112455e0eada1e7a
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  r=/restore/data/vault
                  test -f "$r/AGENTS.md"
                  notes=$(find "$r/notes" -name '*.md' | wc -l)
                  test "$notes" -ge 100
                  git -c safe.directory='*' -C "$r" fsck --connectivity-only --no-progress
                  age=$(( $(date +%s) - $(git -c safe.directory='*' -C "$r" log -1 --format=%ct) ))
                  test "$age" -lt 1209600  # newest commit in the backup is under two weeks old
                  echo "restore drill ok: $notes notes, history intact, last commit ${age}s before now"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
              volumeMounts:
                - name: restore
                  mountPath: /restore
                  readOnly: true
          volumes:
            - name: restore
              emptyDir:
                sizeLimit: 4Gi
