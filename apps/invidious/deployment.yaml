apiVersion: apps/v1
kind: Deployment
metadata:
  name: invidious
  namespace: invidious
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: invidious
  template:
    metadata:
      labels:
        app: invidious
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: gluetun
          image: qmcgaw/gluetun@sha256:b0ee2135e6ba52ad3f102aae9663707cd1c9531485117067a380d3b2b6dd991d
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          env:
            - name: TZ
              value: Europe/Berlin
            - name: VPN_SERVICE_PROVIDER
              value: custom
            - name: VPN_TYPE
              value: wireguard
            - name: WIREGUARD_MTU
              value: "1440"
            - name: FIREWALL_INPUT_PORTS
              value: "3000"
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.42.0.0/16,10.43.0.0/16"
            - name: HEALTH_TARGET_ADDRESSES
              value: "1.1.1.1:443,1.0.0.1:443"
            - name: HEALTH_ICMP_TARGET_IPS
              value: "1.1.1.1,1.0.0.1"
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: invidious-wireguard
                  key: wireguard-private-key
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: invidious-wireguard
                  key: wireguard-addresses
            - name: WIREGUARD_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: invidious-wireguard
                  key: wireguard-public-key
            - name: WIREGUARD_ENDPOINT_IP
              valueFrom:
                secretKeyRef:
                  name: invidious-wireguard
                  key: wireguard-endpoint-ip
            - name: WIREGUARD_ENDPOINT_PORT
              valueFrom:
                secretKeyRef:
                  name: invidious-wireguard
                  key: wireguard-endpoint-port
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        - name: invidious
          image: quay.io/invidious/invidious:latest
          env:
            - name: INVIDIOUS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: invidious-db-auth
                  key: password
            - name: INVIDIOUS_CONFIG
              value: |
                port: 3000
                db:
                  user: invidious
                  password: $(INVIDIOUS_DB_PASSWORD)
                  host: invidious-db-rw.invidious.svc.cluster.local
                  port: 5432
                  dbname: invidious
                check_tables: true
                invidious_companion:
                - private_url: http://localhost:8282/companion
                invidious_companion_key: bayWx608JkTUh70x
                domain: yt.def4alt.com
                external_port: 443
                https_only: true
                hmac_key: 5eb635629d95d15ba907d74a6a87961d115ca59e
                use_pubsub_feeds: true
                use_innertube_for_captions: true
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/v1/stats
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/stats
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
        - name: companion
          image: quay.io/invidious/invidious-companion:latest
          env:
            - name: SERVER_SECRET_KEY
              value: bayWx608JkTUh70x
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
          volumeMounts:
            - name: companion-cache
              mountPath: /var/tmp/youtubei.js
      volumes:
        - name: companion-cache
          emptyDir: {}
