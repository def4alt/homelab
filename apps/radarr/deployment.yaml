apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: transmission
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      initContainers:
        - name: prepare-media-layout
          image: busybox:1.38.0
          command:
            - sh
            - -lc
            - >
              mkdir -p
              /data/media/movies
              /data/downloads/complete
              /data/downloads/complete/movies-radarr
              /data/downloads/incomplete &&
              chown -R 1000:1000 /data/media /data/downloads &&
              chmod -R ug+rwX /data/media /data/downloads
          volumeMounts:
            - name: transmission-data
              mountPath: /data
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:latest
          imagePullPolicy: Always
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Berlin
          ports:
            - name: web
              containerPort: 7878
          readinessProbe:
            tcpSocket:
              port: 7878
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7878
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: radarr-config
              mountPath: /config
            - name: transmission-data
              mountPath: /data
      volumes:
        - name: radarr-config
          persistentVolumeClaim:
            claimName: radarr-config-local
        - name: transmission-data
          persistentVolumeClaim:
            claimName: transmission-data-local
