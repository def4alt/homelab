apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocketbase
  namespace: pocketbase
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pocketbase
  template:
    metadata:
      labels:
        app: pocketbase
    spec:
      initContainers:
        - name: pocketbase-admin
          image: ghcr.io/pocketbase/pocketbase:latest
          command:
            - /bin/sh
            - -c
            - |
              /pb/pocketbase admin create "$PB_ADMIN_EMAIL" "$PB_ADMIN_PASSWORD" || true
          env:
            - name: PB_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: pocketbase-admin
                  key: admin-email
            - name: PB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pocketbase-admin
                  key: admin-password
          volumeMounts:
            - name: data
              mountPath: /pb/pb_data
      containers:
        - name: pocketbase
          image: ghcr.io/pocketbase/pocketbase:latest
          command:
            - /pb/pocketbase
            - serve
            - --http
            - 0.0.0.0:8090
            - --dir
            - /pb/pb_data
          ports:
            - name: http
              containerPort: 8090
          volumeMounts:
            - name: data
              mountPath: /pb/pb_data
          readinessProbe:
            httpGet:
              path: /
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocketbase-data
