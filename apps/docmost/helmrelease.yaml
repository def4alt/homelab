apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: docmost
  namespace: docmost
spec:
  interval: 10m
  chart:
    spec:
      chart: docmost
      version: 0.5.2
      sourceRef:
        kind: HelmRepository
        name: th-charts
        namespace: docmost
  values:
    redis:
      url: redis://docmost-redis.docmost.svc.cluster.local:6379
    postgres:
      appSecretName: docmost-db-app
    docmost:
      appUrl: https://docs.def4alt.com
      disableTelemetry: true
    ingress:
      enabled: true
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.middlewares: infra-authentik-forward-auth@kubernetescrd
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: docs.def4alt.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: docmost-tls
          hosts:
            - docs.def4alt.com
    persistence:
      enabled: true
      storageClassName: longhorn
      resources:
        requests:
          storage: 10Gi
