apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole-etc-local
  namespace: pi-hole
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: manual-local
  volumeName: perun-pihole-etc-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole-dnsmasq-local
  namespace: pi-hole
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: manual-local
  volumeName: perun-pihole-dnsmasq-local
