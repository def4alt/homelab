apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tailscale
  namespace: infra
spec:
  selector:
    matchLabels:
      app: tailscale
  template:
    metadata:
      labels:
        app: tailscale
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: tailscale
      terminationGracePeriodSeconds: 30
      containers:
        - name: tailscale
          image: tailscale/tailscale:latest
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: authkey
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_KUBE_SECRET
              value: tailscale
            - name: TS_USERSPACE
              value: "false"
            - name: TS_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: TS_ACCEPT_DNS
              value: "false"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - tailscale status --json | grep -Eq '"BackendState": *"Running"'
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - tailscale status --json | grep -Eq '"BackendState": *"Running"'
            failureThreshold: 3
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - tailscale status --json | grep -Eq '"BackendState": *"Running"'
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            privileged: true
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
            - name: var-lib-tailscale
              mountPath: /var/lib/tailscale
      volumes:
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: var-lib-tailscale
          hostPath:
            path: /var/lib/tailscale
            type: DirectoryOrCreate
