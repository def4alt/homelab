apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      containers:
        - name: server
          image: ghcr.io/immich-app/immich-server:v1.91.1
          env:
            - name: TZ
              value: "Europe/Berlin"
            - name: UPLOAD_LOCATION
              value: "/data"
            - name: IMMICH_PORT
              value: "2283"
            - name: DB_HOSTNAME
              value: "immich-db-rw.immich.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: immich-db-auth
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db-auth
                  key: password
            - name: DB_DATABASE_NAME
              value: "immich"
            - name: REDIS_HOSTNAME
              value: "immich-redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-redis-auth
                  key: password
          ports:
            - name: http
              containerPort: 2283
          volumeMounts:
            - name: immich-library
              mountPath: /data
      volumes:
        - name: immich-library
          persistentVolumeClaim:
            claimName: immich-library
