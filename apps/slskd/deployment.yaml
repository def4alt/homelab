apiVersion: apps/v1
kind: Deployment
metadata:
  name: slskd
  namespace: transmission
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: slskd
  template:
    metadata:
      labels:
        app: slskd
    spec:
      initContainers:
        - name: prepare-dirs
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - mkdir -p /data/downloads/slskd/.incomplete /data/downloads/slskd
          volumeMounts:
            - name: transmission-data
              mountPath: /data
              subPath: downloads/slskd
      containers:
        - name: slskd
          image: slskd/slskd:latest
          env:
            - name: SLSKD_REMOTE_CONFIGURATION
              value: "true"
            - name: SLSKD_HTTP_PORT
              value: "5030"
            - name: SLSKD_HTTPS_PORT
              value: "5031"
            - name: SLSKD_APP_DIR
              value: /app
            - name: SLSKD_DOWNLOADS_DIR
              value: /data/downloads/slskd
            - name: SLSKD_INCOMPLETE_DIR
              value: /data/downloads/slskd/.incomplete
            - name: SLSKD_SHARE_DIR
              value: /music
            - name: TZ
              value: Europe/Berlin
          ports:
            - name: web
              containerPort: 5030
            - name: slsk
              containerPort: 50300
          readinessProbe:
            tcpSocket:
              port: 5030
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5030
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: slskd-config
              mountPath: /app
            - name: music
              mountPath: /music
            - name: transmission-data
              mountPath: /data
              subPath: downloads/slskd
      volumes:
        - name: slskd-config
          persistentVolumeClaim:
            claimName: slskd-config
        - name: music
          hostPath:
            path: /var/lib/k8s-local-storage/navidrome/music
            type: DirectoryOrCreate
        - name: transmission-data
          persistentVolumeClaim:
            claimName: transmission-data
