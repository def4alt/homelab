apiVersion: apps/v1
kind: Deployment
metadata:
  name: kan
  namespace: kan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kan
  template:
    metadata:
      labels:
        app: kan
    spec:
      containers:
        - name: kan
          image: ghcr.io/kanbn/kan:latest
          env:
            - name: NEXT_PUBLIC_BASE_URL
              value: "https://boards.def4alt.com"
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: kan-secrets
                  key: better-auth-secret
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: kan-secrets
                  key: postgres-url
            - name: NEXT_PUBLIC_ALLOW_CREDENTIALS
              value: "true"
          ports:
            - name: http
              containerPort: 3000
