apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kan
  namespace: kan
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: infra-authentik-forward-auth@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: kan.def4alt.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kan
                port:
                  number: 3000
  tls:
    - secretName: kan-tls
      hosts:
        - kan.def4alt.com
