apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: ai
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "auth": {
          "token": "${OPENCLAW_GATEWAY_TOKEN}"
        },
        "trustedProxies": ["10.42.0.0/16", "10.43.0.0/16"],
        "controlUi": {
          "allowedOrigins": ["https://openclaw.def4alt.com"]
        }
      },
      "agents": {
        "defaults": {
          "model": {
            "primary": "venice/minimax-m25"
          },
          "memorySearch": {
            "extraPaths": ["notes", "ideas"]
          }
        }
      },
      "tools": {
        "web": {
          "search": {
            "provider": "brave",
            "apiKey": "${BRAVE_API_KEY}"
          }
        }
      },
      "channels": {
        "telegram": {
          "enabled": true,
          "botToken": "${TELEGRAM_BOT_TOKEN}",
          "dmPolicy": "allowlist",
          "allowFrom": ["tg:${TELEGRAM_ALLOWED_ID}"],
          "groups": {
            "*": {
              "requireMention": true
            }
          },
          "groupPolicy": "allowlist",
          "groupAllowFrom": ["tg:${TELEGRAM_ALLOWED_ID}"]
        }
      }
    }
