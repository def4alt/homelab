apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: ai
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "controlUi": {
          "allowedOrigins": ["https://openclaw.def4alt.com"]
        }
      },
      "agents": {
        "defaults": {
          "model": {
            "primary": "venice/minimax-m25"
          },
          "memorySearch": {
            "extraPaths": ["notes", "ideas"]
          }
        }
      },
      "channels": {
        "telegram": {
          "enabled": true,
          "dmPolicy": "pairing",
          "groupPolicy": "allowlist",
          "groupAllowFrom": ["tg:${TELEGRAM_ALLOWED_ID}"]
        }
      }
    }
