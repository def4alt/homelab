apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: ai
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local"
      },
      "agents": {
        "defaults": {
          "model": {
            "primary": "venice/minimax-m25"
          },
          "memorySearch": {
            "extraPaths": ["notes", "ideas"]
          }
        }
      },
      "channels": {
        "telegram": {
          "enabled": true,
          "dmPolicy": "pairing"
        }
      }
    }
