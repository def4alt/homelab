apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap-memory-layout
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /data/workspace/memory
              mkdir -p /data/workspace/notes/projects
              mkdir -p /data/workspace/notes/areas
              mkdir -p /data/workspace/notes/resources/lessons
              mkdir -p /data/workspace/notes/archive
              mkdir -p /data/workspace/ideas

              cp /config/openclaw.json /data/openclaw.json

              if [ ! -f /data/workspace/LIFE.md ]; then
                printf '%s\n' \
                  '# Life Profile' \
                  '' \
                  'High-signal personal and professional context used in private sessions.' \
                  > /data/workspace/LIFE.md
              fi

              if [ ! -f /data/workspace/MEMORY.md ]; then
                printf '%s\n' \
                  '# Memory Index' \
                  '' \
                  '- `memory/`: daily logs' \
                  '- `notes/projects/`: active outcomes' \
                  '- `notes/areas/`: ongoing responsibilities' \
                  '- `notes/resources/`: durable reference' \
                  '- `notes/archive/`: completed or dormant' \
                  '- `ideas/`: exploration and feedback' \
                  > /data/workspace/MEMORY.md
              fi

              if [ ! -f /data/workspace/MISSION.md ]; then
                printf '%s\n' \
                  '# Mission' \
                  '' \
                  'Capture durable context in structured notes so each new session starts with retrievable memory.' \
                  > /data/workspace/MISSION.md
              fi

              if [ ! -f /data/workspace/notes/resources/lessons/INDEX.md ]; then
                printf '%s\n' \
                  '# Lessons Index' \
                  '' \
                  '| Date | Slug | Principle |' \
                  '| --- | --- | --- |' \
                  > /data/workspace/notes/resources/lessons/INDEX.md
              fi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:latest
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/index.js
            - gateway
            - --bind
            - lan
            - --port
            - "18789"
          env:
            - name: HOME
              value: /home/node
            - name: OPENCLAW_GATEWAY_BIND
              value: lan
            - name: VENICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: venice-api-key
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: telegram-bot-token
          ports:
            - name: http
              containerPort: 18789
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /readyz
              port: 18789
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 18789
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openclaw-data
        - name: config
          configMap:
            name: openclaw-config
        - name: tmp
          emptyDir: {}
