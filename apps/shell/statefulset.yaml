apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shell
  namespace: shell
spec:
  serviceName: shell
  replicas: 1
  selector:
    matchLabels:
      app: shell
  template:
    metadata:
      labels:
        app: shell
    spec:
      containers:
        - name: shell
          image: debian:trixie-slim
          command: ["/entrypoint.sh"]
          ports:
            - containerPort: 22
              name: ssh
          env:
            - name: SSH_USER
              value: "dev"
            - name: SSH_UID
              value: "1000"
            - name: SSH_GID
              value: "1000"
          volumeMounts:
            - name: home
              mountPath: /home
            - name: ssh-keys
              mountPath: /etc/ssh/authorized_keys
              readOnly: true
            - name: entrypoint
              mountPath: /entrypoint.sh
              subPath: entrypoint.sh
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 22
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 22
            initialDelaySeconds: 30
            periodSeconds: 20

      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: shell-home
        - name: ssh-keys
          secret:
            secretName: ssh-authorized-keys
            optional: true
        - name: entrypoint
          configMap:
            name: shell-entrypoint
            defaultMode: 0755
