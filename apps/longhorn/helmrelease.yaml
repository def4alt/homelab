apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 10m
  chart:
    spec:
      chart: longhorn
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
      version: 1.12.0
  values:
    defaultSettings:
      defaultReplicaCount: 1
      replicaSoftAntiAffinity: true
      storageReservedPercentageForDefaultDisk: 20
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 1
