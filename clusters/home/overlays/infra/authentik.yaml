apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/modes/home/authentik
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: namespaces
    - name: traefik
    - name: cert-manager-issuers
    - name: cnpg
    - name: local-storage
  timeout: 10m
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age

