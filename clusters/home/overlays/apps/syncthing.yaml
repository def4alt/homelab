apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: syncthing
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/syncthing
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: local-storage
    - name: cert-manager
    - name: traefik
  timeout: 10m
  wait: true
