apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: executor
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/executor
  dependsOn:
    - name: namespaces
    - name: longhorn
    - name: traefik
    - name: cert-manager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true
