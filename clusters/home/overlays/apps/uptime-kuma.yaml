apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uptime-kuma
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/uptime-kuma
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: namespaces
    - name: local-storage
    - name: cert-manager-issuers
    - name: traefik
    - name: authentik
  timeout: 10m
  wait: true
