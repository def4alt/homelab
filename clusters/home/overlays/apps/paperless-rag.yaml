apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless-rag
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/paperless-rag
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: paperless
    - name: ollama
    - name: open-webui
  timeout: 10m
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
