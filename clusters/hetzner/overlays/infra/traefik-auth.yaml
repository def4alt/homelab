apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-auth
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/modes/hetzner/traefik-auth
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: traefik
    - name: authentik
  timeout: 10m
  wait: true
