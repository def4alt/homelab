apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: glance
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/modes/hetzner/glance
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: namespaces
    - name: cert-manager-issuers
    - name: traefik
    - name: traefik-auth
    - name: authentik
  timeout: 10m
  wait: true
