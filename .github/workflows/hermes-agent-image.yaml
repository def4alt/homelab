name: Build Hermes agent image

on:
  push:
    branches:
      - main
    paths:
      - apps/hermes-agent/Dockerfile
      - .github/workflows/hermes-agent-image.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/def4alt/hermes-agent-homelab
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Hermes Agent image for homelab with OCR and PDF tooling

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: apps/hermes-agent
          file: apps/hermes-agent/Dockerfile
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
